# Card Management System - Main configuration
spring.application.name=card-management-system

# Oracle 19c (58.65.160.27:1521/ladb, user CMSJ)
spring.datasource.url=jdbc:oracle:thin:@//58.65.160.27:1521/ladb
spring.datasource.username=CMSJ
spring.datasource.password=CMSJ
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate - use existing schema, no DDL (Flyway creates tables)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway - creates tables on first run (set spring.datasource.url to your Oracle DB)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Default APP_ID for login (optional); used by PasswordPolicyService when appId not passed
app.default-app-id=CMS

# Date format for display (ported from DateFormat in old config)
app.date-format=dd/MM/yyyy HH:mm:ss

# Command timeout (e.g. for long-running queries)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
jwt.secret=your-256-bit-secret-key-here-change-in-production
jwt.expiration-ms=86400000

# ELK / Logging (optional)
logging.level.com.cms=INFO
logging.level.org.springframework.security=INFO

# Card Export (Added on 31/3 for Export file) (Generated to Cardmanament->export folder)
cms.card.export.output-dir=./export
cms.card.export.format=BUREAU
cms.card.export.include-pan=false

# Server
server.port=7070